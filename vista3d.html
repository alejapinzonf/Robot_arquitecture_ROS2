<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vista 3D del reto HRI de AndesRobot en la arena 2026: el robot, los invitados y los mensajes ROS 2 de cada paso.">
<title>AndesRobot 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app de una pantalla. Escena 3D de la arena a la izquierda (lo protagonista), panel del paso a la derecha,
   controles del reto debajo de la escena. En teléfono se apilan: escena, controles, panel. Mismos tokens que la página principal. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --sunk:#eceef3;
  --ink:#15171c; --ink-2:#4a5061; --ink-3:#7b8193; --line:#dcdfe6; --line-2:#c3c8d3;
  --brand:#6a2c9e; --brand-soft:#f0e7f8;
  --k-topic:#1b84b8; --k-srv:#b86e06; --k-act:#b8306f;
  --t-hri:#6a2c9e; --t-vis:#0e7f78; --t-nav:#2a5fc4; --t-arm:#b35a10; --t-base:#5a6474;
  --ok:#2f8a4e; --bad:#c23a2b;
  --scene-bg:#e7e9ee; --floor:#efdfc2; --wall:#2b2d33; --outside:#d3d6dd; --furn:#f6f6f4; --furn-dark:#3b3a3c; --wood:#8a5a3b;
  --f-disp:"Archivo", "Arial Narrow", Arial, sans-serif;
  --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1015; --panel:#161920; --sunk:#1c2029;
  --ink:#e9ebf1; --ink-2:#aab0be; --ink-3:#7f8597; --line:#2a2f3b; --line-2:#3a4150;
  --brand:#bb8ff0; --brand-soft:#2a1f3a;
  --k-topic:#55b9e8; --k-srv:#e6a74a; --k-act:#ec6fa9;
  --t-hri:#bb8ff0; --t-vis:#3fc3b9; --t-nav:#729ff3; --t-arm:#ec9a55; --t-base:#9ea7b7;
  --ok:#5cc47f; --bad:#ef6a5a;
  --scene-bg:#12151b; --floor:#8f826c; --wall:#1d1f24; --outside:#2a2e37; --furn:#c9c9c4; --furn-dark:#2d2c2e; --wood:#6e4a33;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1015; --panel:#161920; --sunk:#1c2029;
  --ink:#e9ebf1; --ink-2:#aab0be; --ink-3:#7f8597; --line:#2a2f3b; --line-2:#3a4150;
  --brand:#bb8ff0; --brand-soft:#2a1f3a;
  --k-topic:#55b9e8; --k-srv:#e6a74a; --k-act:#ec6fa9;
  --t-hri:#bb8ff0; --t-vis:#3fc3b9; --t-nav:#729ff3; --t-arm:#ec9a55; --t-base:#9ea7b7;
  --ok:#5cc47f; --bad:#ef6a5a;
  --scene-bg:#12151b; --floor:#8f826c; --wall:#1d1f24; --outside:#2a2e37; --furn:#c9c9c4; --furn-dark:#2d2c2e; --wood:#6e4a33;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
code{font-family:var(--f-mono);font-size:.88em}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);padding-inline:16px;gap:12px;padding-block:12px}
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.mark{font-family:var(--f-disp);font-weight:760;font-stretch:80%;font-size:18px;white-space:nowrap}
.mark span{color:var(--brand)}
.top .sub{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.top .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.back{font-size:13px;color:var(--brand);text-decoration:none;border:1px solid var(--line-2);border-radius:8px;padding:6px 11px;background:var(--panel)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;min-height:0}
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;min-height:0;min-width:0}
.view{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--scene-bg);min-height:280px}
#c{display:block;width:100%;height:100%}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.hud button{font-size:12px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--panel) 88%,transparent);border-radius:999px;padding:5px 10px;cursor:pointer;color:var(--ink-2);backdrop-filter:blur(6px)}
.hud button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.legend3{position:absolute;right:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;font-size:11.5px;color:var(--ink-2);background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 9px;backdrop-filter:blur(6px);max-width:calc(100% - 20px)}
.legend3 i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
.ctl{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13.5px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;min-width:108px}
.row .grow{flex:1}
select{border:1px solid var(--line-2);background:var(--panel);border-radius:7px;padding:6px 8px;font-size:13px}
#scrub{flex:1;min-width:120px;accent-color:var(--brand)}
output{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{font-size:12.5px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--ink-2)}
.pills button.on,.pills button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.pills .lbl{font-size:12px;color:var(--ink-3);align-self:center}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.meta .ph{color:var(--brand);font-weight:600}
.meta .n{margin-left:auto;font-variant-numeric:tabular-nums}
.brtag{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--brand);color:#fff;letter-spacing:0;text-transform:none}
.side h2{font-size:22px;font-stretch:80%;line-height:1.2}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1;padding:5px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.team-hri{--tc:var(--t-hri)} .team-vis{--tc:var(--t-vis)} .team-nav{--tc:var(--t-nav)} .team-arm{--tc:var(--t-arm)} .team-base{--tc:var(--t-base)}
.speech{display:grid;gap:6px}
.speech p{margin:0;font-size:14.5px;padding:8px 12px;border-radius:8px;background:var(--sunk)}
.speech b{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.speech .r{border-left:3px solid var(--brand)} .speech .h{border-left:3px solid var(--k-topic)}
.note{margin:0;font-size:13.5px;color:var(--ink-2)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button{font-size:12.5px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.why{margin:0;font-size:14px;line-height:1.55;color:var(--ink-2);padding:10px 12px;border-radius:8px;background:var(--sunk);border-left:3px solid var(--brand)}
.why b{color:var(--ink)}
.msgs{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.msgs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline;padding-bottom:7px;border-bottom:1px solid var(--line)}
.msgs code{font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.msgs .fl{grid-column:2;font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.kind{font-family:var(--f-mono);font-size:10.5px;padding:2px 6px;border-radius:4px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.04em}
.kind.topic{color:var(--k-topic)} .kind.service{color:var(--k-srv)} .kind.action{color:var(--k-act)} .kind.internal{color:var(--ink-3)}
@media (max-width:560px){ .legend3{display:none} }
@media (max-width:900px){
  .app{height:auto;grid-template-rows:auto auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .view{height:58vh}
  .side{overflow:visible}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>


</head>
<body>
<div class="app">
  <div class="top">
    <span class="mark">Andes<span>Robot</span></span>
    <span class="sub">Reto HRI · vista 3D de la arena</span>
    <span class="grow"></span>
    <div class="seg" role="group" aria-label="Robot">
      <button type="button" id="rMilo" aria-pressed="true">MILO</button>
      <button type="button" id="rMartha" aria-pressed="false">MARTHA</button>
    </div>
    <a class="back" id="back" href="./" hidden>← Arquitectura completa</a>
  </div>
  <div class="main">
    <div class="stage">
      <div class="view" id="view">
        <canvas id="c" aria-label="Arena en 3D con el robot, los invitados, el anfitrión y el bolso en el paso actual"></canvas>
        <div class="hud" role="group" aria-label="Cámara y capas">
          <button type="button" data-cam="general" aria-pressed="true">Vista general</button>
          <button type="button" data-cam="top" aria-pressed="false">Desde arriba</button>
          <button type="button" data-cam="follow" aria-pressed="false">Seguir al robot</button>
          <button type="button" id="tLidar" aria-pressed="false">LiDAR</button>
          <button type="button" id="tGaze" aria-pressed="true">Mirada</button>
        </div>
        <div class="legend3">
          <span><i style="background:var(--brand)"></i>Robot</span>
          <span><i style="background:#2f7fd1"></i>Invitado 1</span>
          <span><i style="background:#2f9e6a"></i>Invitado 2</span>
          <span><i style="background:#d07a2a"></i>Anfitrión</span>
          <span><i style="background:#8d93a1"></i>Otra persona</span>
        </div>
        <div class="err" id="err" hidden><p>No se pudo cargar el motor 3D (three.js). Revisa la conexión a internet y recarga la página.</p></div>
      </div>
      <div class="ctl">
        <div class="row">
          <button class="btn" id="prev" type="button">Anterior</button>
          <button class="btn primary" id="play" type="button">Reproducir</button>
          <button class="btn" id="next" type="button">Siguiente</button>
          <span class="grow"></span>
          <label for="speed" style="font-size:13px;color:var(--ink-2)">Velocidad</label>
          <select id="speed"><option value="0.6">0,6×</option><option value="1" selected>1×</option><option value="1.6">1,6×</option><option value="2.4">2,4×</option></select>
        </div>
        <div class="row"><input id="scrub" type="range" min="0" max="10" value="0" aria-label="Paso del reto"><output id="scrubOut">1 / 1</output></div>
        <div class="pills" id="phases"></div>
        <div class="pills" id="branch" role="group" aria-label="Llegada del invitado"><span class="lbl">Llegada del invitado:</span></div>
      </div>
    </div>
    <aside class="side" id="side" aria-live="polite"></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
var DATA = {"phases": ["Llegada", "Invitado 1", "Invitado 2", "Presentaciones", "Bolso y anfitrión"], "br": {"timbre": "A · timbre", "boton": "B · botón", "ninguno": "C · ninguno", "dos": "D · los dos"}, "teams": {"hri": "Interacción Humano-Robot", "vis": "Visión Computacional", "nav": "Navegación", "arm": "Brazo y Garra", "base": "Estructura y Electrónica", "hw": "Hardware"}, "steps": [{"t": "Ubicar al robot en la entrada y decirle dónde está", "ph": 0, "tz": "L1", "br": "", "set": {"robot": "doorIn", "g1": null, "g2": null, "host": "S2", "bag": null, "door": "open"}, "look": "seatView", "point": "", "say": "", "reply": "", "note": "El equipo deja al robot en la entrada (dentro de la arena) y lo enciende. Lo primero es decirle a Navegación dónde está: <code>task_orchestrator_node<\/code> llama a <code>/nav/set_initial_pose<\/code> con la pose de la entrada guardada en el yaml.", "why": "Al encender, el robot no sabe dónde está en el mapa. Antes de moverse, el orquestador le dice a Navegación la pose de la entrada con <code>/nav/set_initial_pose<\/code> (la toma del yaml) y la localización se ajusta con el LiDAR. Sin esto, la primera navegación sale para cualquier lado.", "teams": ["hri", "nav"], "msgs": [["/nav/set_initial_pose", "service", "task_orchestrator_node", "localization_node"], ["/nav/scan", "topic", "nav_drivers", "localization_node"], ["/nav/pose", "topic", "localization_node", "task_orchestrator_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Inicio de la prueba: el árbitro da la señal", "ph": 0, "tz": "0", "br": "", "set": {}, "look": "seatView", "point": "", "say": "Estoy listo. Presiona el botón verde para empezar.", "reply": "", "note": "El botón se usa una vez para <b>empezar la prueba<\/b>: <code>start_sound_node<\/code> (Estructura) publica <code>/base/start_sound<\/code>. Desde aquí corre el reloj de 7:00 y el robot va hacia su punto inicial.", "why": "El reglamento exige una señal de inicio manual cuando la prueba no empieza abriendo la puerta de la arena (3.6.8). El robot avisa que está listo y dice qué hacer: \"Estoy listo. Presiona el botón verde para empezar\". El árbitro lo presiona y <code>start_sound_node<\/code> publica <code>/base/start_sound<\/code>. Desde ese momento corre el reloj de 7:00 y el robot sale hacia su punto inicial.", "teams": ["base", "hri"], "msgs": [["/base/start_sound", "topic", "start_sound_node", "task_orchestrator_node"]], "bell": false, "button": true, "wait": false, "start": true, "both": false, "moves": []}, {"t": "Ir de la puerta a su zona base", "ph": 0, "tz": "L2", "br": "", "set": {"robot": "start"}, "look": "ahead", "point": "", "say": "", "reply": "", "note": "La idea del equipo: dejar el robot en la puerta y que él solo llegue a la zona que le digamos que es su base. La zona va en el yaml (<code>base_zone<\/code>: centro, orientación y radio) y el orquestador pide ir a su centro con <code>/nav/navigate_to_pose<\/code>, igual que cualquier otra meta.", "why": "El equipo deja el robot en la puerta y el robot llega solo a la zona que le asignamos como base. El timbre solo suena si el robot está esperando en la posición inicial, así que esa zona es la posición inicial que anuncian los organizadores (al menos dos horas antes). El orquestador pide ir al centro de la zona con <code>/nav/navigate_to_pose<\/code>: Navegación calcula la ruta y la velocidad, y Estructura mueve las ruedas (ver \"Cómo se mueve el robot\").", "teams": ["hri", "nav", "base", "vis"], "msgs": [["/nav/navigate_to_pose", "action", "task_orchestrator_node", "path_planner_node"], ["/nav/look_ahead", "service", "task_orchestrator_node", "look_controller_node"], ["/nav/scan", "topic", "nav_drivers", "localization_node"], ["/base/wheel_odom", "topic", "base_driver_node", "odom_ekf_node"], ["/base/odom", "topic", "odom_ekf_node", "localization_node"], ["/nav/map", "topic", "localization_node", "path_planner_node"], ["/vision/objects", "topic", "object_detector_node", "path_planner_node"], ["/nav/cmd_vel_planner", "topic", "path_planner_node", "cmd_vel_mux"], ["/nav/cmd_vel_mux", "topic", "cmd_vel_mux", "safety_filter_node"], ["/cmd_vel", "topic", "safety_filter_node", "base_driver_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": ["robot"]}, {"t": "Llegar y quedar listo en su zona base", "ph": 0, "tz": "L3", "br": "", "set": {"door": "closed"}, "look": "door", "point": "", "say": "Listo, estoy esperando a los invitados.", "reply": "", "note": "Confirma que quedó dentro de la zona (por ejemplo, a menos de 0,3 m del centro), se gira hacia la puerta, pone la luz en \"escuchando\" y avisa. Recién aquí empieza la espera del timbre.", "why": "El robot confirma que quedó dentro de su zona, se gira hacia la puerta, pone la luz en \"escuchando\" y avisa en voz alta que está listo. Desde aquí el orquestador pasa a ESPERANDO_INVITADO.", "teams": ["nav", "hri", "base"], "msgs": [["/nav/pose", "topic", "localization_node", "task_orchestrator_node"], ["/nav/look", "action", "task_orchestrator_node", "look_controller_node"], ["/nav/cmd_vel_look", "topic", "look_controller_node", "cmd_vel_mux"], ["/nav/cmd_vel_mux", "topic", "cmd_vel_mux", "safety_filter_node"], ["/cmd_vel", "topic", "safety_filter_node", "base_driver_node"], ["/base/set_led_state", "service", "task_orchestrator_node", "led_node"], ["/hri/converse", "action", "task_orchestrator_node", "dialogue_manager_node"], ["/hri/say", "topic", "dialogue_manager_node", "tts_node"], ["/hri/play_sound", "service", "tts_node", "speaker_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Esperar en el punto de inicio: ¿qué llega?", "ph": 1, "tz": "1", "br": "", "set": {"g1": "outside"}, "look": "", "point": "", "say": "", "reply": "", "note": "El orquestador escucha <b>los dos caminos a la vez<\/b>: el timbre (<code>/hri/doorbell_detected<\/code>, Interacción, que maneja el micrófono) y el botón (<code>/base/start_button<\/code>, Estructura). Pueden llegar uno, el otro, ninguno o los dos: los pasos 1A, 1B, 1C y 1D muestran cada caso (en la animación, con los botones A, B, C y D). Lo que llega primero decide.", "why": "El timbre solo suena si el robot está esperando en la posición inicial, y para sumar los 2×30 tiene que reaccionar al instante. Por eso el robot se queda quieto y escucha los dos caminos al mismo tiempo: el audio que Interacción analiza y el botón que lee Estructura.", "teams": ["hri", "base"], "msgs": [["/hri/audio", "topic", "audio_capture_node", "doorbell_detector_node"], ["/base/start_button", "topic", "start_sound_node", "task_orchestrator_node"]], "bell": false, "button": false, "wait": true, "start": false, "both": false, "moves": []}, {"t": "Rama A · Llega el timbre", "ph": 1, "tz": "1A", "br": "timbre", "set": {}, "look": "", "point": "", "say": "", "reply": "", "note": "<b>Si llega el timbre:<\/b> <code>doorbell_detector_node<\/code> (Interacción) lo reconoce en <code>/hri/audio<\/code> y publica <code>/hri/doorbell_detected<\/code>. El orquestador arranca de inmediato hacia la puerta y suma los 2×30. Desde ese momento ignora el botón para este invitado.", "why": "Es la rama que más suma: +2×30. El reglamento dice que el timbre solo cuenta si el robot está en la posición inicial y reacciona al instante, por eso el orquestador sale hacia la puerta apenas llega <code>/hri/doorbell_detected<\/code>, sin esperar nada más.", "teams": ["hri"], "msgs": [["/hri/audio", "topic", "audio_capture_node", "doorbell_detector_node"], ["/hri/doorbell_detected", "topic", "doorbell_detector_node", "task_orchestrator_node"]], "bell": true, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Rama B · Llega el botón", "ph": 1, "tz": "1B", "br": "boton", "set": {}, "look": "", "point": "", "say": "", "reply": "", "note": "<b>Si llega el botón:<\/b> Interacción no detectó el timbre, alguien presiona el botón de inicio y <code>start_sound_node<\/code> (Estructura) publica <code>/base/start_button<\/code>. El orquestador va a la puerta igual. Solo se pierden los 2×30 del timbre; todo lo demás se puntúa igual. Si después llega un timbre tarde, se ignora.", "why": "Sirve si Interacción no alcanzó a detectar el timbre. El robot sale a la puerta igual y todo lo que sigue se puntúa normal. Solo se pierden los 2×30.", "teams": ["base", "hri"], "msgs": [["/base/start_button", "topic", "start_sound_node", "task_orchestrator_node"]], "bell": false, "button": true, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Rama C · No llega ninguno", "ph": 1, "tz": "1C", "br": "ninguno", "set": {}, "look": "", "point": "", "say": "", "reply": "", "note": "<b>Si no llega ninguno:<\/b> pasa el tiempo límite (por ejemplo 10 s, parámetro del orquestador) sin timbre ni botón. El robot va a la puerta solo, lo que el reglamento permite (\"waiting for the doorbell is optional\"). Igual que la rama B, solo se pierden los 2×30.", "why": "El reglamento dice textualmente que esperar el timbre es opcional: el robot puede ir directo a la puerta. Por eso nunca se queda esperando para siempre: vence el tiempo límite y sale solo. Así no se arriesga a perder tiempo de los 7:00 ni a que lo saquen por inactividad.", "teams": ["hri"], "msgs": [["/hri/audio", "topic", "audio_capture_node", "doorbell_detector_node"]], "bell": false, "button": false, "wait": true, "start": false, "both": false, "moves": []}, {"t": "Rama D · Llegan los dos", "ph": 1, "tz": "1D", "br": "dos", "set": {}, "look": "", "point": "", "say": "", "reply": "", "note": "<b>Si llegan los dos<\/b> (por ejemplo, suena el timbre y además alguien presiona el botón): el orquestador sigue con el <b>primero<\/b> que llega y solo registra el segundo. El robot sale una sola vez hacia la puerta.", "why": "Puede pasar que el árbitro presione el botón y también suene el timbre, o al revés. El orquestador sigue con <b>lo primero que llega<\/b> y el otro aviso solo se registra. Así el robot nunca arranca dos veces hacia la puerta.", "teams": ["hri", "base"], "msgs": [["/hri/audio", "topic", "audio_capture_node", "doorbell_detector_node"], ["/hri/doorbell_detected", "topic", "doorbell_detector_node", "task_orchestrator_node"], ["/base/start_button", "topic", "start_sound_node", "task_orchestrator_node"]], "bell": true, "button": false, "wait": false, "start": false, "both": true, "moves": []}, {"t": "Ir desde el punto de inicio a la entrada", "ph": 1, "tz": "2", "br": "", "set": {"robot": "doorIn"}, "look": "ahead", "point": "", "say": "", "reply": "", "note": "Aquí se unen las tres ramas: desde este paso todo es igual, llegue el timbre, el botón o ninguno. El líder pide la puerta cerrada para poder sumar los 2×200 de abrirla.", "why": "El invitado espera en la puerta y no entra hasta que el robot inicie la conversación. El robot es quien tiene que acercarse. De paso suma 2×15 si mira hacia donde navega.", "teams": ["hri", "nav", "base", "vis"], "msgs": [["/nav/navigate_to_pose", "action", "task_orchestrator_node", "path_planner_node"], ["/nav/look_ahead", "service", "task_orchestrator_node", "look_controller_node"], ["/nav/scan", "topic", "nav_drivers", "localization_node"], ["/base/wheel_odom", "topic", "base_driver_node", "odom_ekf_node"], ["/base/odom", "topic", "odom_ekf_node", "localization_node"], ["/nav/map", "topic", "localization_node", "path_planner_node"], ["/vision/objects", "topic", "object_detector_node", "path_planner_node"], ["/nav/cmd_vel_planner", "topic", "path_planner_node", "cmd_vel_mux"], ["/nav/cmd_vel_mux", "topic", "cmd_vel_mux", "safety_filter_node"], ["/cmd_vel", "topic", "safety_filter_node", "base_driver_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": ["robot"]}, {"t": "Revisar si la puerta está cerrada", "ph": 1, "tz": "nuevo", "br": "", "set": {}, "look": "door", "point": "", "say": "", "reply": "", "note": "Primero Navegación responde con el LiDAR si la puerta está cerrada y dónde está (<code>/nav/detect_door<\/code>). Si está abierta, se saltan los pasos de la chapa y de abrir.", "why": "Abrir la puerta vale 2×200, el ítem más grande del reto. La puerta está abierta por defecto y el líder puede pedir que la cierren. Lo primero es saber si está cerrada y dónde está: eso lo ve Navegación con el LiDAR.", "teams": ["nav", "hri"], "msgs": [["/nav/scan", "topic", "nav_drivers", "door_detector_node"], ["/nav/detect_door", "service", "task_orchestrator_node", "door_detector_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Mover la garra para mirar la puerta", "ph": 1, "tz": "nuevo", "br": "", "set": {}, "look": "door", "point": "door", "say": "", "reply": "", "note": "Para que Visión vea la chapa, primero hay que <b>activar la garra<\/b>: el orquestador le pide a Brazo y Garra la pose <code>look_door<\/code> con <code>/arm/move_to_pose<\/code> (o que apunte la cámara a la puerta que encontró Navegación). El brazo y el ascensor ponen la cámara de la garra frente a la puerta, a la altura de la chapa.", "why": "La cámara que puede medir la chapa en 3D está en la garra (en MILO es la única con profundidad). Para que Visión la vea, primero hay que <b>activar el brazo<\/b> y ponerlo mirando la puerta. Lo pide el orquestador con <code>/arm/move_to_pose<\/code>: una pose con nombre (<code>look_door<\/code>) o \"apunta la cámara a este punto\" con la pose de la puerta que dio Navegación.", "teams": ["hri", "arm", "base"], "msgs": [["/arm/move_to_pose", "action", "task_orchestrator_node", "arm_controller_node"], ["/arm/joint_states", "topic", "arm_controller_node", "robot_state_publisher"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Buscar la chapa con la cámara de la garra", "ph": 1, "tz": "nuevo", "br": "", "set": {}, "look": "door", "point": "door", "say": "", "reply": "", "note": "Con la cámara ya frente a la puerta, Visión busca la chapa (<code>/vision/detect_handle<\/code>) y responde dónde está y de qué tipo es. La pose sale en el frame de la cámara de la garra con la hora de la imagen.", "why": "Con la cámara ya frente a la puerta, Visión encuentra la chapa y responde dónde está y de qué tipo es (palanca, pomo o barra). Con eso el orquestador sabe qué pedirle al brazo.", "teams": ["vis", "hri"], "msgs": [["/vision/gripper_camera/color", "topic", "camera_driver_node", "object_detector_node"], ["/vision/gripper_camera/depth", "topic", "camera_driver_node", "object_detector_node"], ["/vision/detect_handle", "service", "task_orchestrator_node", "object_detector_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Abrir la puerta", "ph": 1, "tz": "nuevo", "br": "", "set": {"door": "open"}, "look": "door", "point": "", "say": "", "reply": "", "note": "La garra abre la puerta con la chapa que encontró Visión: el orquestador le pasa <code>handle_pose<\/code> a <code>/arm/open_door<\/code> y, mientras se acerca, Brazo y Garra corrige con lo que Visión ve en la cámara de la garra (<code>/vision/gripper_objects<\/code>). Si la base tiene que moverse, lo pide el orquestador a Navegación. Si falla, el robot le pide al árbitro que abra: no suma, pero la prueba sigue.", "why": "Ahora la garra abre la puerta. El orquestador le pasa la chapa que encontró Visión a Brazo y Garra con <code>/arm/open_door<\/code>. Mientras se acerca, el brazo corrige con lo que Visión sigue viendo en la cámara de la garra (<code>/vision/gripper_objects<\/code>), porque la pose inicial nunca es exacta. Visión dice dónde está la chapa; Brazo y Garra decide cómo moverse.", "teams": ["hri", "arm", "vis", "nav", "base"], "msgs": [["/arm/open_door", "action", "task_orchestrator_node", "arm_controller_node"], ["/vision/gripper_camera/color", "topic", "camera_driver_node", "object_detector_node"], ["/vision/gripper_objects", "topic", "object_detector_node", "arm_controller_node"], ["plan de agarre", "internal", "arm_controller_node", "grasp_planner_node"], ["/nav/navigate_to_pose", "action", "task_orchestrator_node", "path_planner_node"], ["/nav/cmd_vel_planner", "topic", "path_planner_node", "cmd_vel_mux"], ["/nav/cmd_vel_mux", "topic", "cmd_vel_mux", "safety_filter_node"], ["/cmd_vel", "topic", "safety_filter_node", "base_driver_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Detectar a la persona", "ph": 1, "tz": "3", "br": "", "set": {}, "look": "g1", "point": "", "say": "", "reply": "", "note": "El invitado espera afuera y no entra hasta que el robot inicie la conversación. El robot es quien se acerca.", "why": "Antes de hablar, el robot tiene que saber dónde está el invitado para mirarlo y para no hablarle a otra persona. Visión publica todas las personas que ve, con su posición y postura.", "teams": ["vis", "hri"], "msgs": [["/vision/camera/color", "topic", "camera_driver_node", "person_detector_node"], ["/vision/camera/depth", "topic", "camera_driver_node", "person_detector_node"], ["/vision/persons", "topic", "person_detector_node", "task_orchestrator_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Mirar a la persona", "ph": 1, "tz": "4", "br": "", "set": {}, "look": "g1", "point": "", "say": "", "reply": "", "note": "El invitado se mueve un poco a los lados: la mirada lo sigue de forma continua (<code>continuous = true<\/code>).", "why": "Mirar a la persona que habla vale 2×50 y solo cuenta si la sigue de forma continua: el invitado se mueve un poco a los lados a propósito para comprobarlo.", "teams": ["vis", "nav", "hri", "base"], "msgs": [["/vision/camera/color", "topic", "camera_driver_node", "person_detector_node"], ["/vision/gaze", "topic", "person_detector_node", "look_controller_node"], ["/nav/look", "action", "task_orchestrator_node", "look_controller_node"], ["/nav/cmd_vel_look", "topic", "look_controller_node", "cmd_vel_mux"], ["/nav/cmd_vel_mux", "topic", "cmd_vel_mux", "safety_filter_node"], ["/cmd_vel", "topic", "safety_filter_node", "base_driver_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Saludar a la persona", "ph": 1, "tz": "5", "br": "", "set": {}, "look": "g1", "point": "", "say": "¡Hola! Bienvenido a la fiesta.", "reply": "", "note": "", "why": "Iniciar la conversación es lo que habilita al invitado a moverse. El orquestador pide un diálogo con <code>/hri/converse<\/code> y <code>dialogue_manager_node<\/code> arma la frase.", "teams": ["hri"], "msgs": [["/hri/converse", "action", "task_orchestrator_node", "dialogue_manager_node"], ["/hri/say", "topic", "dialogue_manager_node", "tts_node"], ["/hri/play_sound", "service", "tts_node", "speaker_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Preguntar el nombre", "ph": 1, "tz": "6", "br": "", "set": {}, "look": "g1", "point": "", "say": "¿Cómo te llamas?", "reply": "Charlie.", "note": "Nada de \"¿Dijiste Charlie?\". Pedir que repita solo si no se escuchó.", "why": "El nombre es el dato principal del invitado. Si lo entiende sin preguntas de confirmación, suma 4×15 al final.", "teams": ["hri"], "msgs": [["/hri/converse", "action", "task_orchestrator_node", "dialogue_manager_node"], ["/hri/say", "topic", "dialogue_manager_node", "tts_node"], ["/hri/play_sound", "service", "tts_node", "speaker_node"], ["/hri/audio", "topic", "audio_capture_node", "asr_node"], ["/hri/speech_text", "topic", "asr_node", "dialogue_manager_node"], ["/hri/dialogue_state", "topic", "dialogue_manager_node", "task_orchestrator_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Recordar a la persona", "ph": 1, "tz": "7", "br": "", "set": {}, "look": "g1", "point": "", "say": "", "reply": "", "note": "Guarda la cara y un atributo visual (por ejemplo, camisa roja) para contárselo después al invitado 2.", "why": "El robot guarda la cara para reconocer al invitado después (pueden cambiarse de asiento) y un atributo visual para contárselo al invitado 2 (4×20).", "teams": ["vis", "hri"], "msgs": [["/vision/camera/color", "topic", "camera_driver_node", "face_recognition_node"], ["/vision/faces", "topic", "face_recognition_node", "task_orchestrator_node"], ["/vision/describe_person", "service", "task_orchestrator_node", "face_recognition_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Asociar el nombre a la persona", "ph": 1, "tz": "8", "br": "", "set": {}, "look": "g1", "point": "", "say": "", "reply": "", "note": "Memorizar mal un nombre o una bebida resta 40.", "why": "Guardar el nombre junto al <code>person_id<\/code> permite presentarlo después sin volver a preguntar.", "teams": ["hri"], "msgs": [["/hri/remember", "service", "task_orchestrator_node", "dialogue_manager_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Preguntar la bebida favorita", "ph": 1, "tz": "9", "br": "", "set": {}, "look": "g1", "point": "", "say": "¿Cuál es tu bebida favorita?", "reply": "Té.", "note": "", "why": "Es el segundo dato del invitado y se usa en las presentaciones (4×30).", "teams": ["hri"], "msgs": [["/hri/converse", "action", "task_orchestrator_node", "dialogue_manager_node"], ["/hri/say", "topic", "dialogue_manager_node", "tts_node"], ["/hri/play_sound", "service", "tts_node", "speaker_node"], ["/hri/audio", "topic", "audio_capture_node", "asr_node"], ["/hri/speech_text", "topic", "asr_node", "dialogue_manager_node"], ["/hri/dialogue_state", "topic", "dialogue_manager_node", "task_orchestrator_node"]], "bell": false, "button": false, "wait": false, "start": false, "both": false, "moves": []}, {"t": "Asociar la bebida a la persona", "ph": 1, "tz": "10", "br": "", "s   $('side').querySelectorAll('[data-tab]').forEach(function(b){ b.addEventListener('click', function(){ TAB = b.getAttribute('data-tab'); renderSide(cur); }); });
  $('scrub').value = i; $('scrubOut').textContent = visIdx + ' / ' + visCount;
  Array.prototype.forEach.call($('phases').children, function(b, k){ b.classList.toggle('on', s.ph === k); });
}
function setBranch(b, keep){
  BRANCH = b;
  $('branch').querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x.getAttribute('data-br') === b); });
  if (keep && STEPS[cur].br && STEPS[cur].br !== b){ var ph = STEPS[cur].ph, j = STEPS.findIndex(function(s){ return s.ph === ph && s.br === b; }); if (j >= 0) go(j, false); }
  else if (keep) renderSide(cur);
}
function setPlaying(v){
  playing = v; $('play').textContent = v ? 'Pausa' : 'Reproducir'; $('play').setAttribute('aria-pressed', v); clearTimeout(timer);
  if (v){ if (cur >= STEPS.length - 1) go(0, false); loop(true); }
}
function loop(first){
  if (!playing) return;
  var n = first ? cur : stepFrom(cur + 1, 1); if (n < 0){ setPlaying(false); return; }
  go(n, true); timer = setTimeout(function(){ loop(false); }, Math.max(2600, stepDurMs + 600) / speed);
}

/* ---------- inicio ---------- */
PHASES.forEach(function(p, k){ var b = document.createElement('button'); b.type = 'button'; b.textContent = p; b.addEventListener('click', function(){ setPlaying(false); go(stepFrom(STEPS.findIndex(function(s){ return s.ph === k; }), 1), false); }); $('phases').appendChild(b); });
[['timbre', 'A · Timbre'], ['boton', 'B · Botón'], ['ninguno', 'C · Ninguno'], ['dos', 'D · Los dos']].forEach(function(o){ var b = document.createElement('button'); b.type = 'button'; b.setAttribute('data-br', o[0]); b.setAttribute('aria-pressed', o[0] === BRANCH); b.textContent = o[1]; b.addEventListener('click', function(){ setBranch(o[0], true); }); $('branch').appendChild(b); });
$('scrub').max = STEPS.length - 1;
$('scrub').addEventListener('input', function(){ setPlaying(false); go(+this.value, false); });
$('prev').addEventListener('click', function(){ setPlaying(false); var j = stepFrom(cur - 1, -1); if (j >= 0) go(j, false); });
$('next').addEventListener('click', function(){ setPlaying(false); var j = stepFrom(cur + 1, 1); if (j >= 0) go(j, true); });
$('play').addEventListener('click', function(){ setPlaying(!playing); });
$('speed').addEventListener('change', function(){ speed = +this.value; });
document.addEventListener('keydown', function(e){ var t = (e.target.tagName || '').toLowerCase(); if (t === 'input' || t === 'select' || t === 'button') return;
  if (e.key === 'ArrowRight'){ setPlaying(false); var j = stepFrom(cur + 1, 1); if (j >= 0) go(j, true); } if (e.key === 'ArrowLeft'){ setPlaying(false); var j2 = stepFrom(cur - 1, -1); if (j2 >= 0) go(j2, false); } });
document.querySelectorAll('[data-cam]').forEach(function(b){ b.addEventListener('click', function(){ setCam(b.getAttribute('data-cam')); }); });
$('tLidar').addEventListener('click', function(){ showLidar = !showLidar; this.setAttribute('aria-pressed', showLidar); if (lidarLines) lidarLines.visible = showLidar; });
$('tGaze').addEventListener('click', function(){ showGaze = !showGaze; this.setAttribute('aria-pressed', showGaze); });
function setRobot(k){ robotKind = k; $('rMilo').setAttribute('aria-pressed', k === 'milo'); $('rMartha').setAttribute('aria-pressed', k === 'martha'); if (ok){ buildRobot(); go(cur, false); } }
$('rMilo').addEventListener('click', function(){ setRobot('milo'); });
$('rMartha').addEventListener('click', function(){ setRobot('martha'); });
if (ok){
  try {
    buildScene(); resize(); setCam('general');
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe($('view'));
    var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme);
    new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
    requestAnimationFrame(tick);
  } catch (e){ ok = false; $('err').hidden = false; console.error(e); }
}
go(0, false);
})();
